<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Codex Alive · 控制中心</title><link rel="stylesheet" href="./studio.css"><script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script></head>
<body>
<header class="app-header"><div class="brand"><span class="brand-icon">a</span><div><strong>codex alive</strong><span>YOUR DIGITAL COMPANION</span></div></div><div class="connection"><i></i><span id="codex-status">正在连接…</span></div><button id="wallpaper" class="primary">进入桌面壁纸</button></header>
<main id="viewport"><div class="preview-meta"><span>LIVE PREVIEW</span><strong>凛</strong><small id="holo-state">正在准备</small></div><div id="caption" hidden></div><div id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div><div class="preview-actions"><button id="reveal">唤醒形象</button><button id="dissolve">预览消散</button></div></main>
<aside><div class="panel-heading"><div><small>CONTROL CENTER</small><h1>随心定义陪伴</h1></div><span id="status">载入中</span></div>
<nav class="panel-nav" aria-label="控制分类"><button data-tab="character" class="selected">角色</button><button data-tab="scene">场景</button><button data-tab="presence">感知</button><button data-tab="voice">声音</button></nav>
<section id="pane-character" class="control-pane"><h2>观察角度</h2><div class="row"><button id="full">全身</button><button id="face">面部</button><button id="back">背面</button></div><label><input type="checkbox" id="rotate">自动旋转</label><label><input type="checkbox" id="skeleton">显示骨骼</label>
<h2>动作与回应</h2><div id="actions" class="button-grid"><button data-motion="idle" disabled>自然待机</button><button data-motion="talk" disabled>交谈手势</button><button data-motion="rest" disabled>原始姿势</button><button data-gesture="wave">挥手问候</button><button data-gesture="nod">点头回应</button><button data-gesture="explain">轻声讲述</button><button data-gesture="look">环顾四周</button><button data-gesture="stretch">舒展放松</button><button data-gesture="tilt">侧耳倾听</button></div>
<div id="motion-controls"></div><h2>面部表情</h2><div class="row"><button id="blink" disabled>眨眼</button><button id="smile" disabled>微笑</button><button id="neutral" disabled>重置</button></div><label><input id="autoblink" type="checkbox" checked>自然眨眼</label><label>转头<input id="head" type="range" min="-.4" max=".4" step=".01" value="0"></label><label>开口<input id="mouth" type="range" min="0" max=".8" step=".01" value="0"></label><p id="details"></p><a class="text-link" href="../assets/companion/character.glb" download>下载角色模型 ↗</a></section>
<section id="pane-scene" class="control-pane" hidden><div id="hologram-controls"></div></section>
<section id="pane-presence" class="control-pane" hidden></section>
<section id="pane-voice" class="control-pane" hidden><h2>选择音色</h2><p>让她用你喜欢的声音回应。</p><select id="voice" aria-label="声音"></select><div id="voice-controls"></div><label><input id="autoread" type="checkbox" checked>朗读任务进度与回答</label><h2>对话与试听</h2><textarea id="text" aria-label="朗读文字">你好，我在这里。今天有什么想和我聊的吗？</textarea><div class="row"><button id="ask" class="primary" disabled>发送对话</button><button id="speak" disabled>试听音色</button><button id="stop">停止</button></div><p id="speech-note" role="status">选择音色后可以试听。</p><p class="privacy-note">自然语音需要联网，朗读文字会发送至微软语音服务。</p></section>
<footer class="panel-footer"><span>本机保存 · 自动同步</span><span>Ctrl + Alt + R</span></footer></aside>
<script type="module" src="./companion.js"></script></body></html>
