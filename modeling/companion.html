<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>桌面伙伴 · 角色工作室</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,'Microsoft YaHei',sans-serif;background:#e8e6e2;color:#253239}#viewport{position:fixed;inset:0 340px 0 0}canvas{display:block}aside{position:fixed;right:0;top:0;bottom:0;width:340px;padding:30px 25px;background:#faf9f6;overflow:auto;border-left:1px solid #d6d6d1}small{letter-spacing:3px;color:#758b83}h1{font-size:27px;margin:6px 0 12px}h2{font-size:13px;margin:24px 0 10px;color:#536d63}p{font-size:12px;color:#738078}button,select,textarea{font:inherit;border:1px solid #ced5cd;border-radius:8px;background:white;padding:9px;color:inherit}button{cursor:pointer;margin:3px 3px 3px 0}button:hover{background:#e5eee7}button.active{background:#315b4d;color:white}button:disabled{opacity:.45;cursor:wait}textarea,select{width:100%}textarea{resize:vertical;min-height:76px}label{display:flex;align-items:center;gap:8px;margin:9px 0}input[type=range]{flex:1;min-width:0;accent-color:#315b4d}#status{padding:12px;background:#eaf0e9;border-radius:8px;font-size:12px}#caption{position:absolute;bottom:50px;left:10%;right:10%;text-align:center;white-space:pre-wrap;background:#ffffffdc;padding:12px;border-radius:12px;pointer-events:none}#hint{position:absolute;bottom:15px;left:24px;color:#6c7974;font-size:12px;pointer-events:none}.row{display:flex;gap:6px}.row button{flex:1}a{color:#315b4d}@media(max-width:750px){aside{width:270px;padding:18px}#viewport{right:270px}}
body.wallpaper aside,body.wallpaper #hint{display:none}body.wallpaper #viewport{right:0}body.wallpaper #caption{left:55%;right:5%;bottom:5%;font-size:18px;max-height:24vh;overflow:hidden}#codex-status{font-size:12px;color:#315b4d}#caption{max-height:32vh;overflow:auto;font-size:15px}</style><script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script></head>
<body><div id="viewport"><div id="caption" hidden></div><div id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div></div><aside><div id="status">正在载入角色…</div>
<h2>Codex 与桌面</h2><div id="codex-status">正在连接 Codex…</div><button id="wallpaper">进入桌面壁纸</button><label><input id="autoread" type="checkbox" checked>朗读每次进度与最终回答</label><p>语音按顺序播放，配合交谈动作。自然音色需联网，朗读文字会发送至微软语音服务。</p><h2>观察角色</h2><div class="row"><button id="full">全身</button><button id="face">面部</button><button id="back">背面</button></div><label><input type="checkbox" id="rotate">自动旋转</label><label><input type="checkbox" id="skeleton">显示骨骼</label>
<h2>身体动作</h2><div id="actions"><button data-motion="idle" disabled>自然待机</button><button data-motion="talk" disabled>交谈手势</button><button data-motion="rest" disabled>原始姿势</button></div><label>转头<input id="head" type="range" min="-0.4" max="0.4" step="0.01" value="0"></label>
<h2>面部反应</h2><button id="blink" disabled>眨眼</button><button id="smile" disabled>微笑</button><button id="neutral" disabled>恢复表情</button><label><input id="autoblink" type="checkbox" checked>自然眨眼</label><label>张嘴<input id="mouth" type="range" min="0" max="0.8" step="0.01" value="0"></label>
<h2>与 Codex 交流</h2><textarea id="text" aria-label="朗读文字">你好，介绍一下你能帮我做什么。</textarea><select id="voice" aria-label="声音"></select><div class="row"><button id="ask" disabled>发送给 Codex</button><button id="speak" disabled>仅朗读</button><button id="stop">停止</button></div><p id="speech-note">桌面版使用本地语音和音量驱动口型。Ctrl + Alt + R 打开面板，Ctrl + Alt + Q 退出壁纸。</p><p id="details"></p><a href="../assets/companion/character.glb" download>下载原始角色 GLB</a></aside><script type="module" src="./companion.js"></script></body></html>
